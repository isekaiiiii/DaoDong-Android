name: Tạo APK Đảo động v3.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cài Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Giữ khóa ký debug ổn định giữa các lần build
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dao-dong-ultra-debug-keystore-v1

      - name: Biên dịch APK debug
        run: gradle --no-daemon assembleDebug

      - name: Tải APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dao-dong-Android-APK-v3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
