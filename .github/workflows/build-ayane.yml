name: Tao APK Ayane

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Bien dich Ayane
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v7

      - name: Cai Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Cai Android SDK
        uses: android-actions/setup-android@v4

      - name: Cai Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cap quyen Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Kiem tra Android resources
        run: python3 scripts/check_android_resources.py

      - name: Bien dich APK
        run: ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Dat ten APK Ayane
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Ayane.apk

      - name: Tai APK Ayane
        uses: actions/upload-artifact@v7
        with:
          name: Ayane-APK
          path: app/build/outputs/apk/debug/Ayane.apk
          if-no-files-found: error
          retention-days: 14
